<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página HTML Simple</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            color: #2c3e50;
        }
        h2 {
            color: #34495e;
            margin-top: 30px;
        }
        p {
            line-height: 1.6;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
            margin: 20px 0;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #3498db;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        ul {
            background-color: white;
            padding: 15px 30px;
            border-radius: 5px;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <h1>Hector-index.html</h1>

    <p>
        hector naiz sisa klasean nago nire eskuman iker dago nire ezkerran iñaki dago
    </p>

        <li>lau bost sei</li>
        <li>zazpi zortzi bederatzi</li>
    </ul>

    <h2>asteburua</h2>
    <table>
        <thead>
            <tr>
                <th>iñaki</th>
                <th>hector</th>
                <th>iker</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>21 urte</td>
                <td>18 urte</td>
                <td>4.5 urte</td>
            </tr>
            <tr>
                <td>ermua</td>
                <td>eibar</td>
                <td>bergara</td>
            </tr>
            <tr>
                <td>entrenador</td>
                <td>brawl stars</td>
                <td>pirata</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
